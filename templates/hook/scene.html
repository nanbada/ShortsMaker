<template>
  <style>
    #__ID__ {
      position: absolute;
      inset: 0;
      background: var(--bg);
    }
    #__ID__ .t-hook-glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(900px 900px at 50% 36%, color-mix(in srgb, var(--accent) 24%, transparent), transparent 70%);
    }
    #__ID__ .t-hook-wrap {
      position: absolute;
      left: 90px;
      right: 90px;
      top: var(--safe-top);
      bottom: calc(1920px - var(--caption-top) + 60px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 44px;
    }
    #__ID__ .t-hook-bar {
      display: block;
      width: 140px;
      height: 14px;
      border-radius: 7px;
      background: var(--accent);
    }
    #__ID__ .t-hook-headline {
      font-size: 120px;
      line-height: 1.14;
      font-weight: 850;
      letter-spacing: -0.02em;
    }
    #__ID__ .t-hook-sub {
      font-size: 58px;
      line-height: 1.3;
      font-weight: 500;
      color: var(--muted);
    }
  </style>
  <div id="__ID__" data-composition-id="__ID__" data-width="1080" data-height="1920">
    <div class="t-hook-glow"></div>
    <div class="t-hook-wrap">
      <div id="__ID__-bar" class="t-hook-bar"></div>
      <div id="__ID__-headline" class="t-hook-headline"></div>
      <div id="__ID__-sub" class="t-hook-sub"></div>
    </div>
  </div>
  <script>
    (() => {
      const id = "__ID__";
      const props = JSON.parse(__PROPS__);
      const t0 = props.$timing.leadInFrames / props.$timing.fps;
      const headline = document.getElementById(`${id}-headline`);
      const sub = document.getElementById(`${id}-sub`);
      headline.textContent = props.headline;
      if (props.sub) sub.textContent = props.sub;
      else sub.remove();
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(`#${id}-bar`, { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.35, ease: "power2.out" }, t0);
      tl.fromTo(headline, { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, t0 + 0.05);
      if (props.sub) tl.fromTo(sub, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0 + 0.3);
      window.__timelines[id] = tl;
    })();
  </script>
</template>
