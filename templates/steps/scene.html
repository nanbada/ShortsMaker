<template>
  <style>
    #__ID__ {
      position: absolute;
      inset: 0;
      background: var(--bg);
    }
    #__ID__ .t-steps-wrap {
      position: absolute;
      left: 90px;
      right: 90px;
      top: var(--safe-top);
      bottom: calc(1920px - var(--caption-top) + 60px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 56px;
    }
    #__ID__ .t-steps-title {
      font-size: 84px;
      line-height: 1.15;
      font-weight: 800;
    }
    #__ID__ .t-steps-list {
      display: flex;
      flex-direction: column;
      gap: 36px;
    }
    #__ID__ .t-steps-item {
      display: flex;
      align-items: center;
      gap: 32px;
    }
    #__ID__ .t-steps-num {
      flex: 0 0 auto;
      width: 96px;
      height: 96px;
      border-radius: 48px;
      background: var(--accent);
      color: #ffffff;
      font-size: 52px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #__ID__ .t-steps-text {
      font-size: 62px;
      line-height: 1.22;
      font-weight: 700;
    }
  </style>
  <div id="__ID__" data-composition-id="__ID__" data-width="1080" data-height="1920">
    <div class="t-steps-wrap">
      <div id="__ID__-title" class="t-steps-title"></div>
      <div id="__ID__-list" class="t-steps-list"></div>
    </div>
  </div>
  <script>
    (() => {
      const id = "__ID__";
      const props = JSON.parse(__PROPS__);
      const fps = props.$timing.fps;
      const t0 = props.$timing.leadInFrames / fps;
      const title = document.getElementById(`${id}-title`);
      const list = document.getElementById(`${id}-list`);
      if (props.title) title.textContent = props.title;
      else title.remove();
      const tl = gsap.timeline({ paused: true });
      if (props.title) tl.fromTo(title, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, t0);
      props.items.forEach((item, i) => {
        const row = document.createElement("div");
        row.id = `${id}-item-${i}`;
        row.className = "t-steps-item";
        const num = document.createElement("div");
        num.className = "t-steps-num";
        num.textContent = String(i + 1);
        const text = document.createElement("div");
        text.className = "t-steps-text";
        text.textContent = item.text;
        row.append(num, text);
        list.append(row);
        tl.fromTo(row, { opacity: 0, x: -50 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, t0 + item.atFrame / fps);
      });
      window.__timelines[id] = tl;
    })();
  </script>
</template>
